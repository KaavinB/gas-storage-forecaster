name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gas
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: gas_markets
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gas -d gas_markets"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      POSTGRES_USER: gas
      POSTGRES_PASSWORD: ci-only
      POSTGRES_DB: gas_markets
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run python -m core.migrate
      - run: uv run pytest -v
