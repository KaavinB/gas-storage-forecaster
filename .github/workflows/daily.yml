name: daily-pipeline

on:
  schedule:
    # 16:37 UTC daily: after the Thursday 10:30 ET EIA storage release in both EST and EDT.
    # Off the top of the hour because GitHub delays cron jobs queued at :00.
    - cron: "37 16 * * *"
  workflow_dispatch:
  # Re-publish when the dashboard itself changes. Every step is idempotent, so re-running
  # ingestion, forecasts and alerts on the same day writes nothing new and sends nothing twice.
  push:
    branches: [main]
    paths: ["dashboards/**"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      ALERT_EMAIL_FROM: ${{ secrets.SMTP_USER }}
      ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked --no-dev
      - name: Migrate schema
        run: uv run python -m core.migrate
      - name: Ingest EIA + NOAA CPC
        run: uv run python -m ingestion.run
      - name: Data-quality checks (stops the run on failure)
        run: uv run python -m ingestion.dq
      - name: Forecast next storage report and Henry Hub direction
        run: uv run python -m models.forecast
      - name: Evaluate alerts and email new ones
        run: uv run python -m alerts.run
      - name: Export dashboard data
        run: uv run python -m dashboards.export
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboards/site

  deploy:
    needs: pipeline
    # Set the repository variable PAGES_ENABLED=true once GitHub Pages is switched on.
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
